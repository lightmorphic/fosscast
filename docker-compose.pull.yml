# FOSSCast, the whole thing, from a single file.
#
# Everything you need to change is in the block at the top. Paste this
# into docker-compose.yml, edit those four lines, and run:
#
#   docker compose up -d
#
# That is the install. No checkout, no build, no .env file, no
# Caddyfile: the published image carries the app and its web assets,
# and both services read their settings from the same block, so the
# domain is typed once.
#
# Point your domain's DNS at the machine first and the HTTPS
# certificate arrives by itself.
#
# It runs the same image as the maintainer's own instances, built from
# the main branch of github.com/lightmorphic/fosscast.

x-config: &config
  DOMAIN: podcast.example.com          # your public address
  ADMIN_EMAIL: you@example.com         # the first admin account
  ADMIN_PASSWORD: change-me-to-something-long
  FOSSSTUDIO_TOKEN: ""                 # only if a studio publishes into this instance

services:
  app:
    image: ghcr.io/lightmorphic/fosscast:latest
    restart: unless-stopped
    environment: *config
    volumes:
      - fosscast_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Automatic HTTPS, reading the same DOMAIN as the app above. Delete
  # this whole service if the machine already runs nginx, a Cloudflare
  # Tunnel or Tailscale, and point that at the app instead (add
  # `ports: ["127.0.0.1:3100:3100"]` to the app service so it can reach
  # it).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: *config
    command: sh -c 'caddy reverse-proxy --from "$$DOMAIN" --to app:3100'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *log

volumes:
  fosscast_data:
  caddy_data:
  caddy_config:
