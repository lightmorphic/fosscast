# MediaMTX configuration for FOSSCast: RTMP in from studios, HLS out.
# Every publish and play attempt is authorised by the FOSSCast app, so
# going live needs a valid stream key while playback stays public.

authMethod: http
authHTTPAddress: http://app:3100/api/internal/mediamtx-auth
# The control API is only reachable inside the compose network (the
# port is never published); the app polls it for live status.
authHTTPExclude:
  - action: api

api: yes
apiAddress: :9997

# Only the two protocols FOSSCast uses.
rtsp: false
webrtc: false
srt: false
moq: false

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsVariant: lowLatency

paths:
  all_others:
